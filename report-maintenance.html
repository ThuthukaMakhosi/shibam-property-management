    <div class="container tm-mt-big tm-mb-big">
      <div class="row">
        <div class="col-xl-9 col-lg-10 col-md-12 col-sm-12 mx-auto">
          <div class="tm-bg-primary-dark tm-block tm-block-h-auto">
            <div class="row">
              <div class="col-12">
                <h2 class="tm-block-title d-inline-block">Report a Problem</h2>
              </div>
            </div>
            <div class="row tm-edit-product-row">
              <div class="col-xl-6 col-lg-6 col-md-12">
                <form action="" id="maintenanceForm" class="tm-edit-product-form">

                  <div class="form-group mb-3">
                    <label
                      for="category"
                      >Category</label
                    >
                    <select
                      class="custom-select tm-select-accounts"
                      id="category"
                      required
                    >
                      <option value="" selected disabled>Select category</option>
                      <option value="plumbing">Plumbing</option>
                      <option value="electrical">Electrical</option>
                      <option value="furniture">Furniture</option>
                      <option value="doors-locks">Doors &amp; Locks</option>
                      <option value="windows">Windows</option>
                      <option value="lighting">Lighting</option>
                      <option value="wifi">Wi-Fi / Internet</option>
                      <option value="cleaning">Cleaning</option>
                      <option value="pest-control">Pest Control</option>
                      <option value="air-conditioning">Air Conditioning</option>
                      <option value="room-building">Room / Building</option>
                      <option value="common-areas">Common Areas</option>
                      <option value="safety">Safety</option>
                      <option value="other">Other</option>
                    </select>
                  </div>

                  <div class="form-group mb-3">
                    <label
                      for="name"
                      >Location/Room
                    </label>
                     <select
                        class="custom-select tm-select-accounts"
                        id="location"
                        name="location"
                        required
                       >
                        <option value="" selected disabled>Select your room</option>

                        <option value="4033Dev-Room01">4033Dev-Room01</option>
                        <option value="4033Dev-Room02">4033Dev-Room02</option>
                        <option value="4033Dev-Room03">4033Dev-Room03</option>
                        <option value="4033Dev-Room04">4033Dev-Room04</option>
                        <option value="4033Dev-Room05">4033Dev-Room05</option>
                        <option value="4033Dev-Room06">4033Dev-Room06</option>
                        <option value="4033Dev-Room07">4033Dev-Room07</option>
                        <option value="4033Dev-Room08">4033Dev-Room08</option>
                        <option value="4033Dev-Room09">4033Dev-Room09</option>
                        <option value="4033Dev-Room10">4033Dev-Room10</option>

                        <option value="4132Dev-Room01">4132Dev-Room01</option>
                        <option value="4132Dev-Room02">4132Dev-Room02</option>
                        <option value="4132Dev-Room03">4132Dev-Room03</option>
                        <option value="4132Dev-Room04">4132Dev-Room04</option>
                        <option value="4132Dev-Room05">4132Dev-Room05</option>
                        <option value="4132Dev-Room06">4132Dev-Room06</option>
                        <option value="4132Dev-Room07">4132Dev-Room07</option>
                        <option value="4132Dev-Room08">4132Dev-Room08</option>
                        <option value="4132Dev-Room09">4132Dev-Room09</option>
                        <option value="4132Dev-Room10">4132Dev-Room10</option>
                    </select>
                  </div>
                  <div class="form-group mb-3">
                    <label
                      for="description"
                      >Description</label
                    >
                    <textarea
                      id = "description"
                      name = "description"
                      class="form-control validate"
                      
                      required
                    ></textarea>
                  </div>
                  
                  <div class="row">
                      <div class="form-group mb-3 col-xs-12 col-sm-6">
                          <label
                            for="expire_date"
                            >Date Problem Started
                          </label>
                          <input
                            id="startDate"
                            name="startDate"
                            type="date"
                            class="form-control validate"
                            data-large-mode="true"
                            required
                          />
                        </div>
                        <div class="form-group mb-3 col-xs-12 col-sm-6">
                          <label
                          for="stock"
                          >Priority
                          </label>
                        
                       <select
                        class="custom-select tm-select-accounts"
                        id="priority"
                        name="priority"
                        required
                       >
                       <option value="low">Low</option>
                       <option value="normal">Normal</option>
                       <option value="urgent">Urgent</option>

                       </select>


                        </div>
                  </div>
                  
              </div>
              <div class="col-xl-6 col-lg-6 col-md-12 mx-auto mb-4">
                <div  id="imagePreview" class="tm-product-img-dummy mx-auto">
                  <i
                    class="fas fa-cloud-upload-alt tm-upload-icon"
                    onclick="document.getElementById('fileInput').click();"
                  ></i>
                </div>
                <div class="custom-file mt-3 mb-3">
                  <input id="fileInput" type="file" style="display:none;" />
                  <input
                    type="button"
                    class="btn btn-primary btn-block mx-auto"
                    value="PHOTO / EVIDENCE"
                    required
                    onclick="document.getElementById('fileInput').click();"
                  />
                </div>
              </div>
              <div class="col-12 py-4">
                <button type="submit" id="submitButton" class="btn btn-primary btn-block text-uppercase">
                   SUBMIT REQUEST
                </button>
              </div>
              <div class="col-12 ">
                <a href="maintenance.html"
                   class="btn btn-primary btn-block text-uppercase">
                   CANCEL
              </a>
              </div>
            </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer class="tm-footer row tm-mt-small">

    <!-- https://jqueryui.com/download/ -->
    <script src="js/bootstrap.min.js"></script>
    <!-- https://getbootstrap.com/ -->
    <script>
      $(function() {
        $("#expire_date").datepicker();
      });
    </script>
    <script src="js/practice.js"></script>
<script src="js/maintenance.js"></script>
    <script src="js/requests.js"></script>
