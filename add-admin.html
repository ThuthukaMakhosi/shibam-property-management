    <div class="container tm-mt-big tm-mb-big">
      <div class="row">
        <div class="col-xl-9 col-lg-10 col-md-12 col-sm-12 mx-auto">
          <div class="tm-bg-primary-dark tm-block tm-block-h-auto ">
            <div class="row">
              <div class="col-12 ">
                <h2 class="tm-block-title d-inline-block">Add Adminstrator</h2>
              </div>
            </div>
            <div class="row tm-edit-product-row d-flex justify-content-center align-items-center">
              <div class="col-xl-6 col-lg-6 col-md-12 ">
            <form action="" id="addadminForm" class="tm-edit-product-form">


                  <div class="form-group mb-3">
                    <label
                      for="firstname"
                      >First Name/s</label>
                    <input
                      id = "firstname"
                      name = "firstname"
                      class="form-control validate"
                      required
                    ></input>
                  </div>

                  <div class="form-group mb-3">
                    <label
                      for="lastname"
                      >Last Name</label
                    >
                    <input
                      id = "lastname"
                      name = "lastname"
                      class="form-control validate"
                      required
                    ></input>
                  </div>

                  <div class="form-group mb-3">
                    <label
                      for="category"
                      >Category</label
                    >
                    <select
                      class="custom-select tm-select-accounts"
                      id="category"
                      required
                    >
                      <option value="" selected disabled>Select category</option>
                      <option value="owner">Owner</option>
                      <option value="Res Manager">Res Manager</option>
                      <option value="Technician">Technician</option>
                      
                    </select>
                  </div>

                
                  <div class="form-group mb-3">
                    <label
                      for="identityNo"
                      >ID/Passport No.</label
                    >
                    <input
                      id = "identityNo"
                      name = "identityNo"
                      class="form-control validate"
                      required
                    ></input>
                  </div>
                  
                  
                      <div class="form-group mb-3">
                              <label
                                for="gender"
                                >Gender
                              </label>
                            <select
                          class="custom-select tm-select-accounts"
                          id="gender"
                          required
                        >
                          <option value="" selected disabled>Select gender</option>
                          <option value="male">Male</option>
                          <option value="female">Female</option>
                          <option value="prefer not to say">Prefer Not To Say</option>
                        </select>
                      </div>

                        
                  
                  
              </div>
             
              <div class="col-12 py-4">
                <button type="submit" id="submitButton" class="btn btn-primary btn-block text-uppercase">
                   Add User
                </button>
              </div>
              <div class="col-12 ">
                <a href="users.html"
                   class="btn btn-primary btn-block text-uppercase">
                   CANCEL
              </a>
              </div>
            </form>
            </div>
          </div>
